# Software factory: enforce Conventional Commits in CI.
# Copy to .github/workflows/conventional-commits.yml together with commitlint.config.mjs and
# list "commitlint" in factory.git.required_checks (and in branch protection, where available).
name: Conventional Commits

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install commitlint
        run: npm install --no-save --no-package-lock @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
      - name: Lint every commit introduced by the pull request
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint pushed commits, including squash-merge messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from "${{ github.event.before }}" --to "${{ github.event.after }}" --verbose
      - name: Lint the initial seed commit
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: git show -s --format=%B HEAD | npx --no-install commitlint --verbose
